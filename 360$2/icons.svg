<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- 考研助手图标集 -->
  <!-- 主图标 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#shine)"/>
  <!-- 毕业帽 -->
  <polygon points="256,120 400,200 256,280 112,200" fill="white" opacity="0.95"/>
  <polygon points="256,280 400,200 400,260 256,340 112,260 112,200" fill="white" opacity="0.7"/>
  <!-- 流苏 -->
  <line x1="400" y1="200" x2="400" y2="320" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="330" r="12" fill="#fbbf24"/>
  <!-- 书本 -->
  <rect x="176" y="350" width="160" height="80" rx="8" fill="white" opacity="0.85"/>
  <line x1="256" y1="350" x2="256" y2="430" stroke="#6366f1" stroke-width="4"/>
  <line x1="196" y1="370" x2="240" y2="370" stroke="#6366f1" stroke-width="3" opacity="0.5"/>
  <line x1="196" y1="385" x2="240" y2="385" stroke="#6366f1" stroke-width="3" opacity="0.5"/>
  <line x1="196" y1="400" x2="230" y2="400" stroke="#6366f1" stroke-width="3" opacity="0.5"/>
  <line x1="272" y1="370" x2="316" y2="370" stroke="#6366f1" stroke-width="3" opacity="0.5"/>
  <line x1="272" y1="385" x2="316" y2="385" stroke="#6366f1" stroke-width="3" opacity="0.5"/>
  <line x1="272" y1="400" x2="306" y2="400" stroke="#6366f1" stroke-width="3" opacity="0.5"/>
</svg>
